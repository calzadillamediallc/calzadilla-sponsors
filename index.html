<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    /* LIFT VIDEO */
    #lift {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    /* MEDHEALTH LOWER THIRD */
    #medhealth {
      display: none;
      position: absolute;

      width: 62%;
      height: auto;

      left: 2.5%;
      bottom: 2.5%;

      top: auto;
      right: auto;

      transform: none;
      object-fit: contain;
    }
  </style>
</head>

<body>

<div id="stage">

  <video
    id="lift"
    muted
    playsinline
    preload="auto">
    <source src="LIFT DRIK.webm" type="video/webm">
  </video>

  <img
    id="medhealth"
    src="MedHealth"
    alt="MedHealth Clinical">

</div>

<script>

  const lift = document.getElementById("lift");
  const medhealth = document.getElementById("medhealth");

  // Tiempo entre Lift y MedHealth = 10 segundos
  const BETWEEN_SPONSORS = 10000;

  // Tiempo después del bloque completo = 10 minutos
  const BETWEEN_BLOCKS = 600000;

  // MedHealth visible durante 8 segundos
  const MEDHEALTH_TIME = 8000;


  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }


  async function showLift() {

    medhealth.style.display = "none";

    lift.style.display = "block";
    lift.currentTime = 0;

    try {
      await lift.play();
    } catch (error) {
      console.log("Lift playback error:", error);
    }

    await new Promise(resolve => {
      lift.onended = resolve;
    });

    lift.style.display = "none";
  }


  async function showMedHealth() {

    lift.style.display = "none";

    medhealth.style.display = "block";

    await sleep(MEDHEALTH_TIME);

    medhealth.style.display = "none";
  }


  async function sponsorLoop() {

    while (true) {

      // LIFT
      await showLift();

      // Esperar 10 segundos
      await sleep(BETWEEN_SPONSORS);

      // MEDHEALTH
      await showMedHealth();

      // Esperar 10 minutos antes del próximo bloque
      await sleep(BETWEEN_BLOCKS);
    }
  }


  window.addEventListener("load", sponsorLoop);

</script>

</body>
</html>
