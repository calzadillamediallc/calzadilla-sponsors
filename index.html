<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    /* LIFT VIDEO */
    #lift {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    /* MEDHEALTH LOWER THIRD */
    #medhealth {
      display: none;

  position: absolute;

  width: 58%;

  height: auto;

  left: 4%;

  bottom: 4%;

  top: auto;

  right: auto;

  transform: none;

  object-fit: contain;

}
  </style>
</head>

<body>

  <div id="stage">

    <video
      id="lift"
      muted
      playsinline
      preload="auto">
      <source src="LIFT DRIK.webm" type="video/webm">
    </video>

    <img
      id="medhealth"
      src="MedHealth"
      alt="MedHealth Clinical">

  </div>

  <script>

    const lift = document.getElementById("lift");
    const medhealth = document.getElementById("medhealth");

    /*
      PRUEBA:
      10 segundos entre sponsors.

      Cuando terminemos las pruebas,
      cambiaremos esto a 180000
      para tener 3 minutos.
    */
    const WAIT_TIME = 10000;

    // MedHealth permanece 8 segundos
    const MEDHEALTH_TIME = 8000;


    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }


    async function showLift() {

      // Asegurarnos de que MedHealth esté oculto
      medhealth.style.display = "none";

      // Mostrar Lift
      lift.style.display = "block";
      lift.currentTime = 0;

      try {
        await lift.play();
      } catch (error) {
        console.log("Lift playback error:", error);
      }

      // Esperar hasta que termine el video
      await new Promise(resolve => {

        lift.onended = resolve;

      });

      // Ocultar Lift
      lift.style.display = "none";
    }


    async function showMedHealth() {

      // Asegurarnos de que Lift esté oculto
      lift.style.display = "none";

      // Mostrar MedHealth
      medhealth.style.display = "block";

      // Mantenerlo 8 segundos
      await sleep(MEDHEALTH_TIME);

      // Ocultarlo
      medhealth.style.display = "none";
    }


    async function sponsorLoop() {

      while (true) {

        // 1. LIFT
        await showLift();

        // 2. Esperar
        await sleep(WAIT_TIME);

        // 3. MEDHEALTH
        await showMedHealth();

        // 4. Esperar
        await sleep(WAIT_TIME);

        // Repetir desde Lift
      }
    }


    window.addEventListener("load", sponsorLoop);

  </script>

</body>
</html>
